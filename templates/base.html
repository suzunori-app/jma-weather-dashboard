<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}気象庁データダッシュボード{% endblock %}</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    nav.tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 2px solid #ccc;
      margin-bottom: 1.5rem;
    }
    nav.tabs a {
      padding: 0.5rem 1rem;
      text-decoration: none;
      color: #333;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
    }
    nav.tabs a:hover { background: #f0f0f0; }
    nav.tabs a.active {
      border-color: #ccc;
      background: #f5f5f5;
      font-weight: bold;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="tabs">
    <a href="{{ url_for('index') }}" class="{{ 'active' if active_page == 'index' }}">ホーム</a>
    <a href="{{ url_for('overview') }}" class="{{ 'active' if active_page == 'overview' }}">概況</a>
    <a href="{{ url_for('temperature') }}" class="{{ 'active' if active_page == 'temperature' }}">気温マップ</a>
    <a href="{{ url_for('weekly') }}" class="{{ 'active' if active_page == 'weekly' }}">週間予報</a>
  </nav>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
