{% extends "base.html" %}

{% block title %}都道府県別 最高・最低気温マップ{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  #map { height: 640px; width: 100%; border: 1px solid #ccc; }
  .legend {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0.75rem 0 1rem;
    font-size: 0.9rem;
    color: #333;
  }
  .legend-bar {
    width: 200px;
    height: 12px;
    background: linear-gradient(to right, rgb(0,80,255), rgb(255,80,0));
    border: 1px solid #999;
  }
  .note { color: #666; font-size: 0.85rem; margin-top: 0.5rem; }
</style>
{% endblock %}

{% block content %}
<h1>都道府県別 最高・最低気温マップ</h1>
<p class="note">
  気象庁 天気予報APIの直近の予報対象日を表示します。夕方以降は翌日分になる場合があります。
</p>
<div class="legend">
  <span>低い</span>
  <div class="legend-bar"></div>
  <span>高い</span>
</div>
<div id="map"></div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const points = {{ points | tojson }};

  const map = L.map('map').setView([37.5, 138.0], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 10,
  }).addTo(map);

  function tempColor(temp) {
    if (temp === null) {
      return '#999999';
    }
    const clamped = Math.max(10, Math.min(38, temp));
    const ratio = (clamped - 10) / (38 - 10);
    const red = Math.round(255 * ratio);
    const blue = Math.round(255 * (1 - ratio));
    return `rgb(${red}, 80, ${blue})`;
  }

  points.forEach((point) => {
    const marker = L.circleMarker([point.lat, point.lon], {
      radius: 10,
      color: '#333',
      weight: 1,
      fillColor: tempColor(point.max),
      fillOpacity: 0.85,
    }).addTo(map);

    const hasData = point.max !== null && point.min !== null;
    const label = hasData ? `${point.max}° / ${point.min}°` : '取得失敗';
    marker.bindTooltip(`${point.name}<br>${label}`);

    const popupDate = point.date ? `${point.date} ` : '';
    const popupText = hasData
      ? `<b>${point.name}</b><br>${popupDate}最高 ${point.max}℃ / 最低 ${point.min}℃`
      : `<b>${point.name}</b><br>データを取得できませんでした`;
    marker.bindPopup(popupText);
  });
</script>
{% endblock %}
